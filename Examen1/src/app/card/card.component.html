<div class="mb-4 p-8 flex items-center justify-center">
  <p-card [style]="{ width: '20rem', overflow: 'hidden' }">
    <ng-template #header>
      <img 
        alt="Card" 
        class="w-full" 
        src="https://encrypted-tbn3.gstatic.com/images?q=tbn:ANd9GcQOWdYxR3d6BdFQx23nV8psFxWftNYkHQcoAAcPvk6VHZ4n4cZ2L4-UTQbk0XbxD5vuOQptcALpj78FmBpQt-VQCuvioPbG5J0jqFOehA" />
    </ng-template>

    <ng-template #title> Advanced Card </ng-template>
    <ng-template #subtitle> Card subtitle </ng-template>

    <p>
      Lorem ipsum dolor sit amet, consectetur adipisicing elit. Inventore sed consequuntur error repudiandae numquam deserunt
      quisquam repellat libero asperiores earum nam nobis, culpa ratione quam perferendis esse, cupiditate neque quas!
    </p>

    <ng-template #footer>
      <div class="flex gap-4 mt-1">
        <p-button 
          label="Cancel" 
          severity="secondary" 
          [outlined]="true" 
          styleClass="w-full" />
        <p-button 
          label="Save" 
          styleClass="w-full" />
      </div>
    </ng-template>
  </p-card>
</div>
